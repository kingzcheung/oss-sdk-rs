[package]
name = "oss-sdk-rs"
version = "1.2.4"
authors = ["NoXF <xianyou.cyq@gmail.com>","kingzcheung <kingzcheung@gmail.com>"]
edition = "2021"
readme = "README.md"
description = "Aliyun OSS SDK"
license = "Apache-2.0"
repository = "https://github.com/kingzcheung/oss-sdk-rs"

[dependencies]
tokio = {version = "1.39.3", features = ["full"]}
reqwest = {version = "0.12.7", features = ["json","charset","rustls-tls"],  default-features = false}
base64 = "0.22.1"
chrono = "0.4.20"
log = "0.4.17"
quick-xml = { version = "0.36.1", features = ["serialize"] }
derive_more = {version = "1",features = ["full"]}
bytes = "1.0"
async-trait = "0.1.53"
httpdate = "1.0.2"
hmac = "0.12"
sha1 = "0.10"
lazy_static = "1.4.0"
serde = { version = "1.0.209", features = ["derive"] }
thiserror = "1.0.40"
serde_json = "1.0.127"
urlencoding = "2.1.3"
sha2 = "0.10.8"
hex = "0.4.3"
futures-util = "0.3"
pin-project-lite = "0.2"

[features]
default = ["rustls-tls"]
default-tls = ["reqwest/default-tls"]
rustls-tls = ["reqwest/rustls-tls"]

[target.'cfg(unix)'.dev-dependencies]
dotenvy = "0.15.7"

