[package]
name = "oss-sdk-rs"
version = "2.0.0"
authors = ["kingzcheung <kingzcheung@gmail.com>"]
edition = "2021"
readme = "README.md"
description = "Aliyun OSS SDK"
license = "Apache-2.0"
repository = "https://github.com/kingzcheung/oss-sdk-rs"
keywords = ["oss", "aliyun", "alibaba", "storage", "sdk"]
categories = ["api-bindings", "web-programming"]

[dependencies]
# 异步运行时
tokio = { version = "1", features = ["full"] }

# HTTP 客户端
reqwest = { version = "0.12", features = ["json", "charset", "rustls-tls"], default-features = false }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.36", features = ["serialize"] }

# 加密和编码
base64 = "0.22"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
md5 = "0.7"
hex = "0.4"

# 时间处理
chrono = "0.4"

# 字节处理
bytes = "1"

# URL 编码
urlencoding = "2"

# 异步
async-trait = "0.1"
futures-util = "0.3"

# 错误处理
thiserror = "1"

[features]
default = ["rustls-tls"]
default-tls = ["reqwest/default-tls"]
rustls-tls = ["reqwest/rustls-tls"]

[dev-dependencies]
dotenvy = "0.15"
